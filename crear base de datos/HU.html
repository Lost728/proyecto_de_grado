<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Historias de Usuario</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            margin-bottom: 30px;
        }

        .header h1 {
            color: #333;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 1.1em;
        }

        .form-container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            margin-bottom: 30px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-weight: 600;
            color: #444;
            margin-bottom: 8px;
            font-size: 0.95em;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            font-family: inherit;
            transition: all 0.3s;
        }

        .form-group textarea {
            min-height: 100px;
            resize: vertical;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .criterios-container {
            margin-top: 20px;
        }

        .criterios-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 15px;
        }

        .criterio-item {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .criterio-item input {
            flex: 1;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 0.95em;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .btn-success {
            background: #10b981;
            color: white;
        }

        .btn-success:hover {
            background: #059669;
        }

        .btn-danger {
            background: #ef4444;
            color: white;
            padding: 8px 16px;
        }

        .btn-danger:hover {
            background: #dc2626;
        }

        .btn-secondary {
            background: #6b7280;
            color: white;
        }

        .btn-secondary:hover {
            background: #4b5563;
        }

        .button-group {
            display: flex;
            gap: 15px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .stories-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(500px, 1fr));
            gap: 20px;
        }

        .user-story-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            animation: fadeIn 0.5s;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .story-header {
            background: #6366f1;
            color: white;
            padding: 15px 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .story-id {
            font-weight: 700;
            font-size: 0.9em;
        }

        .story-title-header {
            font-weight: 700;
            font-size: 0.9em;
        }

        .story-enunciado {
            background: #818cf8;
            color: white;
            padding: 15px 20px;
            text-align: center;
            font-weight: 600;
            font-size: 1em;
        }

        .story-roles {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            background: #a5b4fc;
            color: white;
        }

        .story-role-item {
            padding: 10px;
            text-align: center;
            font-weight: 600;
            font-size: 0.85em;
            border-right: 1px solid white;
        }

        .story-role-item:last-child {
            border-right: none;
        }

        .story-content {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            min-height: 150px;
        }

        .story-content-item {
            padding: 20px;
            border-right: 1px solid #e5e7eb;
            display: flex;
            flex-direction: column;
        }

        .story-content-item:last-child {
            border-right: none;
        }

        .story-content-label {
            font-weight: 700;
            color: #333;
            margin-bottom: 8px;
            font-size: 0.95em;
        }

        .story-content-text {
            color: #555;
            font-size: 0.9em;
            line-height: 1.5;
        }

        .story-criterios {
            background: #6366f1;
            color: white;
            padding: 12px 20px;
            text-align: center;
            font-weight: 600;
            font-size: 0.95em;
        }

        .story-criterios-list {
            padding: 20px;
            background: #f9fafb;
        }

        .story-criterios-list ul {
            list-style: none;
            padding: 0;
        }

        .story-criterios-list li {
            padding: 8px 0;
            color: #333;
            font-size: 0.9em;
            position: relative;
            padding-left: 20px;
        }

        .story-criterios-list li:before {
            content: "•";
            position: absolute;
            left: 0;
            color: #6366f1;
            font-weight: bold;
            font-size: 1.2em;
        }

        .story-actions {
            padding: 15px 20px;
            background: #f3f4f6;
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        .btn-small {
            padding: 8px 16px;
            font-size: 0.9em;
        }

        @media (max-width: 768px) {
            .stories-container {
                grid-template-columns: 1fr;
            }

            .story-roles,
            .story-content {
                grid-template-columns: 1fr;
            }

            .story-content-item {
                border-right: none;
                border-bottom: 1px solid #e5e7eb;
            }

            .story-content-item:last-child {
                border-bottom: none;
            }

            .story-role-item {
                border-right: none;
                border-bottom: 1px solid white;
            }

            .story-role-item:last-child {
                border-bottom: none;
            }
        }

        .empty-state {
            background: white;
            padding: 60px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .empty-state h3 {
            color: #666;
            font-size: 1.5em;
            margin-bottom: 10px;
        }

        .empty-state p {
            color: #999;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📝 Generador de Historias de Usuario</h1>
            <p>Crea historias de usuario profesionales para tus proyectos ágiles</p>
        </div>

        <div class="form-container">
            <h2 style="margin-bottom: 20px; color: #333;">Nueva Historia de Usuario</h2>
            
            <div class="form-grid">
                <div class="form-group">
                    <label for="storyId">ID de la Historia (Ej: HU-01)</label>
                    <input type="text" id="storyId" placeholder="HU-01" required>
                </div>

                <div class="form-group">
                    <label for="storyTitle">Título de la Historia</label>
                    <input type="text" id="storyTitle" placeholder="Iniciar sesión en el sistema" required>
                </div>
            </div>

            <div class="form-group" style="margin-bottom: 20px;">
                <label for="storyEnunciado">Enunciado de la Historia</label>
                <input type="text" id="storyEnunciado" placeholder="Como administrador, quiero iniciar sesión para..." required>
            </div>

            <div class="form-grid">
                <div class="form-group">
                    <label for="storyRol">Rol (Como...)</label>
                    <input type="text" id="storyRol" placeholder="Administrador" required>
                </div>

                <div class="form-group">
                    <label for="storyFuncionalidad">Funcionalidad (Quiero...)</label>
                    <input type="text" id="storyFuncionalidad" placeholder="Un inicio de sesión" required>
                </div>

                <div class="form-group">
                    <label for="storyRazon">Razón (Para...)</label>
                    <input type="text" id="storyRazon" placeholder="poder controlar quien va ingresar..." required>
                </div>
            </div>

            <div class="criterios-container">
                <label style="font-weight: 600; color: #444; margin-bottom: 10px; display: block;">
                    Criterios de Aceptación
                </label>
                <div class="criterios-list" id="criteriosList">
                    <div class="criterio-item">
                        <input type="text" placeholder="Validar los datos de inicio de sesión...">
                        <button class="btn btn-danger btn-small" onclick="removeCriterio(this)">✕</button>
                    </div>
                </div>
                <button class="btn btn-success" onclick="addCriterio()">+ Añadir Criterio</button>
            </div>

            <div class="button-group">
                <button class="btn btn-primary" onclick="generateStory()">✨ Generar Historia de Usuario</button>
                <button class="btn btn-secondary" onclick="clearForm()">🗑️ Limpiar Formulario</button>
            </div>
        </div>

        <div id="storiesContainer" class="stories-container">
            <div class="empty-state">
                <h3>No hay historias de usuario</h3>
                <p>Completa el formulario y genera tu primera historia de usuario</p>
            </div>
        </div>
    </div>

    <script>
        let stories = [];

        function addCriterio() {
            const list = document.getElementById('criteriosList');
            const item = document.createElement('div');
            item.className = 'criterio-item';
            item.innerHTML = `
                <input type="text" placeholder="Ingrese un criterio de aceptación...">
                <button class="btn btn-danger btn-small" onclick="removeCriterio(this)">✕</button>
            `;
            list.appendChild(item);
        }

        function removeCriterio(button) {
            const list = document.getElementById('criteriosList');
            if (list.children.length > 1) {
                button.parentElement.remove();
            } else {
                alert('Debe haber al menos un criterio de aceptación');
            }
        }

        function generateStory() {
            const id = document.getElementById('storyId').value.trim();
            const title = document.getElementById('storyTitle').value.trim();
            const enunciado = document.getElementById('storyEnunciado').value.trim();
            const rol = document.getElementById('storyRol').value.trim();
            const funcionalidad = document.getElementById('storyFuncionalidad').value.trim();
            const razon = document.getElementById('storyRazon').value.trim();

            if (!id || !title || !enunciado || !rol || !funcionalidad || !razon) {
                alert('Por favor, completa todos los campos obligatorios');
                return;
            }

            const criteriosInputs = document.querySelectorAll('#criteriosList input');
            const criterios = [];
            criteriosInputs.forEach(input => {
                if (input.value.trim()) {
                    criterios.push(input.value.trim());
                }
            });

            if (criterios.length === 0) {
                alert('Debe agregar al menos un criterio de aceptación');
                return;
            }

            const story = {
                id,
                title,
                enunciado,
                rol,
                funcionalidad,
                razon,
                criterios
            };

            stories.push(story);
            renderStories();
            clearForm();
        }

        function renderStories() {
            const container = document.getElementById('storiesContainer');
            
            if (stories.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <h3>No hay historias de usuario</h3>
                        <p>Completa el formulario y genera tu primera historia de usuario</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = stories.map((story, index) => `
                <div class="user-story-card">
                    <div class="story-header">
                        <div>
                            <div style="opacity: 0.8; font-size: 0.75em; margin-bottom: 3px;">Identificador (ID) de la historia</div>
                            <div class="story-id">${story.id}</div>
                        </div>
                        <div>
                            <div style="opacity: 0.8; font-size: 0.75em; margin-bottom: 3px;">Título de la Historia</div>
                            <div class="story-title-header">${story.title}</div>
                        </div>
                    </div>

                    <div class="story-enunciado">Enunciado de la Historia</div>

                    <div class="story-roles">
                        <div class="story-role-item">Rol</div>
                        <div class="story-role-item">Funcionalidad</div>
                        <div class="story-role-item">Razón</div>
                    </div>

                    <div class="story-content">
                        <div class="story-content-item">
                            <div class="story-content-label">Como:</div>
                            <div class="story-content-text">${story.rol}</div>
                        </div>
                        <div class="story-content-item">
                            <div class="story-content-label">Quiero:</div>
                            <div class="story-content-text">${story.funcionalidad}</div>
                        </div>
                        <div class="story-content-item">
                            <div class="story-content-label">Para:</div>
                            <div class="story-content-text">${story.razon}</div>
                        </div>
                    </div>

                    <div class="story-criterios">Criterios de aceptación</div>
                    
                    <div class="story-criterios-list">
                        <ul>
                            ${story.criterios.map(c => `<li>${c}</li>`).join('')}
                        </ul>
                    </div>

                    <div class="story-actions">
                        <button class="btn btn-primary btn-small" onclick="editStory(${index})">✏️ Editar</button>
                        <button class="btn btn-secondary btn-small" onclick="duplicateStory(${index})">📋 Duplicar</button>
                        <button class="btn btn-danger btn-small" onclick="deleteStory(${index})">🗑️ Eliminar</button>
                    </div>
                </div>
            `).join('');
        }

        function clearForm() {
            document.getElementById('storyId').value = '';
            document.getElementById('storyTitle').value = '';
            document.getElementById('storyEnunciado').value = '';
            document.getElementById('storyRol').value = '';
            document.getElementById('storyFuncionalidad').value = '';
            document.getElementById('storyRazon').value = '';
            
            const list = document.getElementById('criteriosList');
            list.innerHTML = `
                <div class="criterio-item">
                    <input type="text" placeholder="Validar los datos de inicio de sesión...">
                    <button class="btn btn-danger btn-small" onclick="removeCriterio(this)">✕</button>
                </div>
            `;
        }

        function deleteStory(index) {
            if (confirm('¿Estás seguro de eliminar esta historia de usuario?')) {
                stories.splice(index, 1);
                renderStories();
            }
        }

        function editStory(index) {
            const story = stories[index];
            document.getElementById('storyId').value = story.id;
            document.getElementById('storyTitle').value = story.title;
            document.getElementById('storyEnunciado').value = story.enunciado;
            document.getElementById('storyRol').value = story.rol;
            document.getElementById('storyFuncionalidad').value = story.funcionalidad;
            document.getElementById('storyRazon').value = story.razon;

            const list = document.getElementById('criteriosList');
            list.innerHTML = story.criterios.map(c => `
                <div class="criterio-item">
                    <input type="text" value="${c}">
                    <button class="btn btn-danger btn-small" onclick="removeCriterio(this)">✕</button>
                </div>
            `).join('');

            stories.splice(index, 1);
            renderStories();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function duplicateStory(index) {
            const story = { ...stories[index] };
            story.id = story.id + '-COPIA';
            story.criterios = [...story.criterios];
            stories.push(story);
            renderStories();
        }
    </script>
</body>
</html>
